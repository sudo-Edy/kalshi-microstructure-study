[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kms"
version = "0.1.0"
description = "Reference components for an empirical study of event-contract market microstructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code), CC BY 4.0 (docs)" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
